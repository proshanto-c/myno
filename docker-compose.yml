# Myno — full stack. Everything runs in Docker.
#   db        Postgres (patients, logs, descriptors, blacklist, conversations)
#   backend   FastAPI orchestrator (Claude, personalization, blacklist, DB, TTS proxy)
#   voice     VoiceStudio: the cloned voice the guide speaks in    (GPU)
#
# Hearing, understanding and answering are one Google Live session held by the
# backend — there is no ASR service and no TTS service any more. What they were
# is in legacy/, with a note saying what replaced them.
#   frontend  React app behind nginx (proxies /api -> backend, /asr -> asr)
#
# Prereqs on the A100 host: Docker, the NVIDIA Container Toolkit, and an NGC
# login (`docker login nvcr.io`) so the NeMo base image can be pulled.
#
#   ANTHROPIC_API_KEY=sk-ant-...  docker compose up --build
#
# Then open http://<host>/  (put TLS in front for microphone access — see the
# deployment guide). The ASR + TTS images are large and download the models on
# first boot, so the first `up` takes a while.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myno
      POSTGRES_PASSWORD: myno
      POSTGRES_DB: myno
    volumes:
      - myno_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myno"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://myno:myno@db:5432/myno
      # Google does the hearing, the conversation and the analyses. Claude is
      # still in Dalīl, the research service, and nowhere else in this app.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in your environment}
      GOOGLE_FAST_MODEL: ${GOOGLE_FAST_MODEL:-gemini-3.5-flash}
      GOOGLE_DEEP_MODEL: ${GOOGLE_DEEP_MODEL:-gemini-3.5-flash}
      GOOGLE_LIVE_MODEL: ${GOOGLE_LIVE_MODEL:-gemini-2.5-flash-native-audio-latest}
      GOOGLE_LIVE_VOICE: ${GOOGLE_LIVE_VOICE:-Achernar}
      # The cloned voice. VOICE_ID is the profile id VoiceStudio gives back when
      # the reference recording is registered (scripts/clone-voice.sh prints it,
      # and writes it into .env). Unset it and the app falls back to NeMo.
      VOICE_URL: http://voice:3900
      VOICE_ID: ${VOICE_ID:-}
      VOICE_MODEL: ${VOICE_MODEL:-omnivoice}
      VOICE_SPEED: ${VOICE_SPEED:-1.15}
      # The app's own replies, in a voice that is plainly not hers.
      VOICE_APP_ID: ${VOICE_APP_ID:-demo0001}
      VOICE_APP_SPEED: ${VOICE_APP_SPEED:-1.05}
      # Every line the app has said before, kept between restarts: the guided
      # demo repeats itself word for word, and synthesis costs seconds a line.
      VOICE_CACHE_DIR: /var/cache/myno-voice
    volumes:
      - voice_cache:/var/cache/myno-voice
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback: every patient route is an unauthenticated integer id,
      # so a public 8080 hands the whole database to anyone who finds the port,
      # whatever nginx is configured to do. The browser reaches it through
      # nginx's /api/ on 80/443.
      - "127.0.0.1:8080:8080"

  # Dalīl (دليل) — the evidence module. Reviewed literature behind the claims the
  # app makes. Publishes no host port: nginx is the only way in.
  dalil:
    build: ./dalil
    environment:
      DATABASE_URL: postgresql+psycopg2://myno:myno@db:5432/myno
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your environment}
      APP_URL: http://backend:8080
      # NCBI asks that automated callers identify themselves; a key raises the
      # rate limit from 3 to 10 requests a second.
      NCBI_TOOL: ${NCBI_TOOL:-tawaazun-dalil}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      # Creates the first reviewer, and only while there are none.
      DALIL_BOOTSTRAP: ${DALIL_BOOTSTRAP:-}
    depends_on:
      db:
        condition: service_healthy

  # The voice the guide speaks in: VoiceStudio, cloning one reference recording
  # and serving it on an OpenAI-compatible /v1/audio/speech. Loopback only —
  # it ships no authentication of its own, and the browser never talks to it
  # directly: every line goes through the backend's /api/tts.
  #
  # OFF BY DEFAULT, because the guide says the same twenty-seven sentences
  # every run and they are rendered to frontend/public/voice/ as ordinary
  # files. Holding a model in 4GB of VRAM to replay a fixed script is a GPU
  # doing a web server's job — and it made a GPU a requirement for running the
  # app at all.
  #
  #   docker compose --profile voice up -d voice     # to change the narration
  #   ./scripts/render-voice.sh                      # ... and record it
  #   docker compose stop voice                      # done with it
  #
  # It is still what answers /api/tts for anything not in the manifest: a
  # spoken reply to something a person actually said. With it down, those fall
  # back to the browser's own voice.
  voice:
    profiles: ["voice"]
    image: ghcr.io/debpalash/omnivoice-studio:latest
    container_name: voicestudio
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - voicestudio_data:/app/omnivoice_data
    environment:
      HF_HOME: /app/omnivoice_data/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      OMNIVOICE_DATA_DIR: /app/omnivoice_data
      PYTHONPATH: /app/backend
      PYTHONUNBUFFERED: "1"
      OMNIVOICE_BIND_HOST: 0.0.0.0
      OMNIVOICE_SERVER_MODE: "1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  myno_db:
  # Named to match the volume the standalone container filled, so the models
  # and the cloned profile survive the move into compose.
  voicestudio_data:
    name: voicestudio-data
  voice_cache:
