server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri /index.html; }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    # The researcher portal. `location /research/` beats the SPA catch-all above
    # by longest prefix, so these files are served rather than index.html.
    location = /research { return 301 /research/; }
    location /research/  { try_files $uri $uri/ /research/index.html; }

    # Dalīl's API. Lazy upstream resolve, like /asr below: without it nginx
    # refuses to start when the container is down, taking the patient app with
    # it. Longer read timeout because appraisal calls a model.
    location /dalil/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dalil_upstream dalil;
        # A proxy_pass with a variable in it does not strip the location prefix
        # the way a trailing slash normally would — nginx cannot compute that at
        # config time — so the rewrite has to say it explicitly.
        rewrite ^/dalil/(.*)$ /$1 break;
        proxy_pass http://$dalil_upstream:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }

    # ASR WebSocket (cache-aware streaming); lazy upstream resolve.
    location /asr {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $asr_upstream asr;
        proxy_pass http://$asr_upstream:8000/asr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# HTTPS — needed so browsers grant microphone access over the public IP
# (self-signed cert generated at build time; click through the warning once).
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri /index.html; }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    # The researcher portal — see the :80 block above. Both server blocks need
    # every location; the file duplicates all of them.
    location = /research { return 301 /research/; }
    location /research/  { try_files $uri $uri/ /research/index.html; }

    location /dalil/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dalil_upstream dalil;
        # A proxy_pass with a variable in it does not strip the location prefix
        # the way a trailing slash normally would — nginx cannot compute that at
        # config time — so the rewrite has to say it explicitly.
        rewrite ^/dalil/(.*)$ /$1 break;
        proxy_pass http://$dalil_upstream:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }

    location /asr {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $asr_upstream asr;
        proxy_pass http://$asr_upstream:8000/asr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
