# Every location, once. Included by both the :80 and :443 server blocks — this
# file used to be duplicated in full, and a location added to one block but not
# the other is a bug you only find over HTTPS.

# The two doors.
location = / { try_files /index.html =404; }

# Tawaazun — the patient app.
location = /tawaazun { return 301 /tawaazun/; }
location /tawaazun/  { try_files $uri $uri/ /tawaazun/index.html; }

# Dalīl — the researcher portal, and its API one level in. nginx matches the
# longer prefix first, which is what keeps /dalil/api/ from being swallowed by
# the portal's own SPA fallback.
location = /dalil { return 301 /dalil/; }
location /dalil/api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dalil_upstream dalil;
    # proxy_pass with a variable in it does not strip the location prefix the
    # way a trailing slash normally would, so the rewrite says it explicitly.
    rewrite ^/dalil/api/(.*)$ /$1 break;
    proxy_pass http://$dalil_upstream:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;
}
location /dalil/ { try_files $uri $uri/ /dalil/index.html; }

# Where the portal used to live.
location /research { return 301 /dalil/; }

# The patient API.
location /api/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
}

# ASR WebSocket (cache-aware streaming); lazy upstream resolve so nginx still
# boots when the GPU container is down.
location /asr {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $asr_upstream asr;
    proxy_pass http://$asr_upstream:8000/asr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

# Anything else falls back to the doors rather than to one of the two apps.
location / { try_files $uri /index.html; }
